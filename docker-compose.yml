name: orbitwork

x-app: &app
  image: orbitwork-app:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  app:
    <<: *app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATA_DIR: /app/.data
      DB_PATH: /app/.data/orbitwork.db
      SANDBOX_QUEUE_DIR: /jobs
      TRUST_PROXY: "loopback,linklocal,uniquelocal"
    volumes:
      - orbit_data:/app/.data
      - sandbox_jobs:/jobs
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      sandbox:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      start_period: 20s
      retries: 3

  sandbox:
    <<: *app
    command: ["node", "dist/sandbox-worker.js"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    environment:
      SANDBOX_PORT: 8790
      SANDBOX_QUEUE_DIR: /jobs
      SANDBOX_TMP_DIR: /tmp
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-6000}
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    volumes:
      - sandbox_jobs:/jobs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  orbit_data:
  sandbox_jobs:
  caddy_data:
  caddy_config:
